<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DALUPEZMAR | Sistema Integral de Asistencia y Fotochecks</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#002855">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DALUPEZMAR">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css?v=3.1">

  <style>
    /* Visor de alta resolución sin barras dobles ni cortes */
    .app-frame {
      width: 100%;
      height: calc(100dvh - 56px);
      border: none;
      transition: opacity 0.15s ease-in-out;
      background: transparent;
    }
    @media (max-width: 768px) {
      .app-frame {
        height: calc(100dvh - 114px);
      }
    }
    
    /* Efectos de botón de navegación activo */
    .nav-tab.active-tab {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .mob-tab.active-tab {
      color: #38bdf8 !important;
      position: relative;
    }
    .mob-tab.active-tab::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: #38bdf8;
      border-radius: 9999px;
      box-shadow: 0 0 10px #38bdf8;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-hidden select-none">

  <!-- CABECERA SUPERIOR COMPACTA Y ULTRA-NÍTIDA (56px) -->
  <header class="h-14 md:h-16 bg-slate-900/95 backdrop-blur-xl border-b border-slate-800/80 px-3 md:px-6 flex items-center justify-between z-40 relative shadow-md">
    
    <!-- LOGO Y TÍTULO DALUPEZMAR (ALTO CONTRASTE BLANCO) -->
    <div class="flex items-center gap-2.5 cursor-pointer" onclick="switchTab('dashboard')">
      <img src="/icons/icon-192.png" alt="DALUPEZMAR Logo" class="w-9 h-9 md:w-10 md:h-10 rounded-xl shadow-md border border-cyan-400/40 object-cover">
      <div class="flex flex-col">
        <div class="flex items-center gap-1.5">
          <span class="text-sm md:text-base font-black tracking-tight text-white leading-none">DALUPEZMAR</span>
          <span class="px-1.5 py-0.5 rounded text-[8px] md:text-[9px] font-black bg-blue-500/20 text-cyan-300 border border-cyan-500/30">OFICIAL</span>
        </div>
        <span class="text-[10px] text-slate-400 font-semibold hidden sm:inline leading-tight mt-0.5">Control de Asistencia & Fotochecks</span>
      </div>
    </div>

    <!-- PESTAÑAS DE NAVEGACIÓN EN ESCRITORIO Y TABLETS -->
    <nav class="hidden md:flex items-center gap-1 bg-slate-950/70 p-1 rounded-2xl border border-slate-800/80">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-tab active-tab px-3.5 py-1.5 rounded-xl text-xs font-extrabold transition flex items-center gap-1.5">
        <i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i> Panel
      </button>

      <button onclick="switchTab('employees')" id="nav-employees" class="nav-tab px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <i data-lucide="users" class="w-3.5 h-3.5"></i> Personal (87)
      </button>

      <button onclick="switchTab('badges')" id="nav-badges" class="nav-tab px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <i data-lucide="id-card" class="w-3.5 h-3.5"></i> Fotochecks
      </button>

      <button onclick="switchTab('reports')" id="nav-reports" class="nav-tab px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> Tareo & Planillas
      </button>

      <button onclick="switchTab('kiosk')" id="nav-kiosk" class="nav-tab px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <i data-lucide="scan" class="w-3.5 h-3.5 text-cyan-400"></i> Kiosco QR
      </button>

      <button onclick="switchTab('remote')" id="nav-remote" class="nav-tab px-3.5 py-1.5 rounded-xl text-xs font-extrabold text-slate-300 hover:text-white transition flex items-center gap-1.5">
        <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-400"></i> GPS & Campo
      </button>
    </nav>

    <!-- ACCIONES DE CABECERA: INSTALAR, TEMA Y CERRAR SESIÓN -->
    <div class="flex items-center gap-1.5 md:gap-2">
      
      <!-- BOTÓN INSTALAR APP PWA -->
      <button id="btn-install-pwa" onclick="triggerPwaInstall()" class="px-2.5 md:px-3.5 py-1.5 md:py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-[11px] md:text-xs shadow-md flex items-center gap-1.5 transition active:scale-95">
        <i data-lucide="download" class="w-3.5 h-3.5 stroke-[2.5]"></i>
        <span class="hidden xs:inline">Instalar App</span>
      </button>

      <!-- Botón Tema -->
      <button onclick="toggleUnifiedTheme()" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 transition" title="Cambiar Modo Claro / Oscuro">
        <i data-lucide="sun" class="w-4 h-4"></i>
      </button>

      <!-- Botón Salir -->
      <button onclick="handleLogout()" class="p-2 rounded-xl bg-slate-800 hover:bg-rose-900/40 text-slate-400 hover:text-rose-300 transition" title="Cerrar Sesión">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>

    </div>
  </header>

  <!-- VISOR UNIFICADO PRINCIPAL (SIN SCROLL DOBLE) -->
  <main class="flex-1 w-full relative bg-slate-950 overflow-hidden">
    <iframe id="main-app-frame" src="/dashboard.html" class="app-frame w-full" title="Módulo DALUPEZMAR"></iframe>
  </main>

  <!-- BARRA DE NAVEGACIÓN INFERIOR NATIVA PARA CELULARES (58px) -->
  <nav class="md:hidden h-[58px] bg-slate-900/98 backdrop-blur-2xl border-t border-slate-800 grid grid-cols-6 items-center px-1 z-40 safe-bottom shadow-2xl">
    
    <button onclick="switchTab('dashboard')" id="mob-dashboard" class="mob-tab active-tab flex flex-col items-center justify-center py-1 transition cursor-pointer">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Panel</span>
    </button>

    <button onclick="switchTab('employees')" id="mob-employees" class="mob-tab flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
      <i data-lucide="users" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Personal</span>
    </button>

    <button onclick="switchTab('badges')" id="mob-badges" class="mob-tab flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
      <i data-lucide="id-card" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Carnets</span>
    </button>

    <button onclick="switchTab('reports')" id="mob-reports" class="mob-tab flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
      <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Tareo</span>
    </button>

    <button onclick="switchTab('kiosk')" id="mob-kiosk" class="mob-tab flex flex-col items-center justify-center py-1 text-slate-400 hover:text-cyan-300 transition cursor-pointer">
      <i data-lucide="scan" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Kiosco</span>
    </button>

    <button onclick="switchTab('remote')" id="mob-remote" class="mob-tab flex flex-col items-center justify-center py-1 text-slate-400 hover:text-emerald-300 transition cursor-pointer">
      <i data-lucide="map-pin" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Campo</span>
    </button>

  </nav>

  <!-- BANNER FLOTANTE DE INSTALACIÓN PWA -->
  <div id="pwa-install-banner" class="fixed bottom-16 left-3 right-3 max-w-md mx-auto z-50 glass-panel p-3.5 rounded-2xl border border-amber-500/40 bg-slate-900/98 shadow-2xl flex items-center justify-between gap-3 hidden animate-bounce-short">
    <div class="flex items-center gap-3">
      <img src="/icons/icon-192.png" class="w-10 h-10 rounded-xl shadow-md border border-amber-500/40 object-cover">
      <div>
        <p class="text-xs font-black text-white">Instalar DALUPEZMAR</p>
        <p class="text-[10px] text-amber-300 font-semibold">Acceso rápido sin navegador en tu celular</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <button onclick="dismissInstallBanner()" class="p-1.5 text-slate-400 hover:text-white">
        <i data-lucide="x" class="w-4 h-4"></i>
      </button>
      <button onclick="triggerPwaInstall()" class="px-3 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-md">
        Instalar
      </button>
    </div>
  </div>

  <!-- MODAL DE AYUDA DE INSTALACIÓN PARA IPHONE / IPAD (IOS) -->
  <div id="modal-ios-install" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md hidden flex items-center justify-center p-4">
    <div class="glass-panel p-6 rounded-3xl max-w-sm w-full border border-slate-700 shadow-2xl space-y-4 text-center">
      <img src="/icons/icon-192.png" class="w-16 h-16 rounded-2xl mx-auto shadow-xl border border-cyan-400/40">
      <h3 class="text-sm font-black text-white">Instalar DALUPEZMAR en tu Teléfono</h3>
      <p class="text-xs text-slate-300 leading-relaxed text-left">
        1. En Safari, toca el botón <b>Compartir</b> <i data-lucide="share" class="w-4 h-4 inline text-blue-400"></i>.<br>
        2. Selecciona <b>"Añadir a la pantalla de inicio"</b> 📲.<br>
        3. Toca <b>"Añadir"</b> arriba a la derecha.
      </p>
      <button onclick="document.getElementById('modal-ios-install').classList.add('hidden')" class="w-full py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs">
        Entendido
      </button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js?v=3.1"></script>
  <script src="/js/auth.js?v=3.1"></script>
  <script>
    lucide.createIcons();

    const MODULE_ROUTES = {
      dashboard: '/dashboard.html',
      employees: '/employees.html',
      badges: '/badge-designer.html',
      reports: '/reports.html',
      kiosk: '/kiosk.html',
      remote: '/remote-attendance.html'
    };

    let currentActiveTab = 'dashboard';

    function switchTab(tabKey) {
      if (!MODULE_ROUTES[tabKey]) return;
      currentActiveTab = tabKey;

      const frame = document.getElementById('main-app-frame');
      if (frame) {
        frame.style.opacity = '0.3';
        frame.src = MODULE_ROUTES[tabKey];
        frame.onload = () => { 
          frame.style.opacity = '1';
          syncThemeWithFrame();
        };
      }

      // Actualizar pestañas Desktop
      document.querySelectorAll('.nav-tab').forEach(btn => {
        btn.classList.remove('active-tab');
        btn.classList.add('text-slate-300');
      });
      const activeNav = document.getElementById(`nav-${tabKey}`);
      if (activeNav) {
        activeNav.classList.add('active-tab');
        activeNav.classList.remove('text-slate-300');
      }

      // Actualizar pestañas Móvil
      document.querySelectorAll('.mob-tab').forEach(btn => {
        btn.classList.remove('active-tab');
        btn.classList.add('text-slate-400');
      });
      const activeMob = document.getElementById(`mob-${tabKey}`);
      if (activeMob) {
        activeMob.classList.add('active-tab');
        activeMob.classList.remove('text-slate-400');
      }

      lucide.createIcons();
    }

    function toggleUnifiedTheme() {
      toggleAppTheme();
      syncThemeWithFrame();
    }

    function syncThemeWithFrame() {
      const frame = document.getElementById('main-app-frame');
      if (frame && frame.contentWindow && frame.contentWindow.applyAppTheme) {
        const theme = getSavedTheme();
        frame.contentWindow.applyAppTheme(theme);
      }
    }

    function handleLogout() {
      if (confirm('¿Deseas cerrar sesión del sistema?')) {
        api.clearSession();
        window.location.href = '/index.html';
      }
    }

    // =========================================================================
    // LÓGICA DE INSTALACIÓN PWA
    // =========================================================================
    let deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const banner = document.getElementById('pwa-install-banner');
      if (banner && !sessionStorage.getItem('pwa_dismissed')) {
        banner.classList.remove('hidden');
      }
    });

    function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          deferredPrompt = null;
          document.getElementById('pwa-install-banner')?.classList.add('hidden');
        });
      } else {
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        if (isIos) {
          document.getElementById('modal-ios-install')?.classList.remove('hidden');
        } else {
          alert('Para instalar DALUPEZMAR:\nEn Chrome/Edge, haz clic en los 3 puntos ⋮ y selecciona "Instalar aplicación" o "Añadir a la pantalla principal".');
        }
      }
    }

    function dismissInstallBanner() {
      document.getElementById('pwa-install-banner')?.classList.add('hidden');
      sessionStorage.setItem('pwa_dismissed', 'true');
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(console.warn);
      });
    }
  </script>
</body>
</html>
