<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>DALUPEZMAR | Sistema Integral de Asistencia y Fotochecks</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#002855">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DALUPEZMAR">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css?v=5.0">

  <style>
    html, body {
      overflow-x: hidden !important;
      overscroll-behavior-x: none !important;
      touch-action: pan-y pinch-zoom !important;
      max-width: 100vw !important;
      width: 100% !important;
      position: relative !important;
    }

    /* Estructura del marco unificado - Restricción estricta de ancho de iframe en móviles y tablets */
    .app-frame, #main-app-frame {
      width: 1px !important;
      min-width: 100% !important;
      max-width: 100% !important;
      height: calc(100dvh - 56px);
      border: none;
      background: transparent;
      overflow-x: hidden !important;
      overscroll-behavior-x: none !important;
      touch-action: pan-y !important;
      display: block !important;
    }
    @media (max-width: 768px) {
      .app-frame, #main-app-frame {
        height: calc(100dvh - 114px);
      }
    }

    /* Sidebar lateral fijo sin transiciones de desplazamiento lateral en móviles */
    #app-sidebar {
      transition: width 0.2s ease, opacity 0.2s ease;
    }
    
    @media (max-width: 768px) {
      #app-sidebar.sidebar-collapsed {
        display: none !important;
      }
      #app-sidebar:not(.sidebar-collapsed) {
        display: flex !important;
        width: 80% !important;
        max-width: 280px !important;
      }
    }
    
    @media (min-width: 769px) {
      .sidebar-collapsed {
        width: 68px !important;
        min-width: 68px !important;
      }
      .sidebar-collapsed .sidebar-label,
      .sidebar-collapsed .sidebar-badge,
      .sidebar-collapsed .sidebar-header-text,
      .sidebar-collapsed .sidebar-role-box {
        display: none !important;
      }
    }

    /* Pestaña activa en sidebar */
    .sidebar-tab.active-tab {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.35);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .mob-tab.active-tab {
      color: #38bdf8 !important;
      position: relative;
    }
    .mob-tab.active-tab::after {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 20px;
      height: 3px;
      background: #38bdf8;
      border-radius: 9999px;
      box-shadow: 0 0 10px #38bdf8;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col overflow-hidden select-none">

  <!-- CABECERA SUPERIOR UNIVERSAL ULTRA-COMPACTA (56px) - SIN OVERFLOW -->
  <header class="h-14 bg-slate-900/95 backdrop-blur-xl border-b border-slate-800 px-3 md:px-5 flex items-center justify-between z-40 relative shadow-md">
    
    <!-- LADO IZQUIERDO: BOTÓN HAMBURGUESA + LOGO DALUPEZMAR -->
    <div class="flex items-center gap-2">
      <!-- Botón Ver / Ocultar Menú Lateral -->
      <button onclick="toggleSidebar()" id="btn-toggle-sidebar" class="p-2 rounded-xl bg-slate-800/90 hover:bg-slate-700 text-slate-200 border border-slate-700 shadow-sm transition flex items-center justify-center cursor-pointer shrink-0" title="Ver / Ocultar Menú Lateral (☰)">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>

      <!-- Logo Oficial y Nombre DALUPEZMAR -->
      <div class="flex items-center gap-2 cursor-pointer truncate" onclick="switchTab('dashboard')">
        <img src="/icons/icon-192.png" alt="DALUPEZMAR Logo" class="w-8 h-8 rounded-xl shadow-md border border-cyan-400/40 object-cover shrink-0">
        <div class="flex flex-col truncate">
          <div class="flex items-center gap-1">
            <span class="text-sm font-black tracking-tight text-white leading-none truncate">DALUPEZMAR</span>
          </div>
          <span id="current-view-title" class="text-[10px] text-cyan-400 font-bold truncate leading-tight mt-0.5">Panel de Control</span>
        </div>
      </div>
    </div>

    <!-- LADO DERECHO: ACCIONES RÁPIDAS (COMPACTAS Y SIN DESBORDE) -->
    <div class="flex items-center gap-1.5 shrink-0">

      <!-- Botón Modo Claro / Oscuro -->
      <button onclick="toggleUnifiedTheme()" class="btn-theme-toggle p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-amber-300 border border-slate-700/60 transition cursor-pointer" title="Cambiar Modo Claro / Oscuro">
        <i data-lucide="sun" class="w-4 h-4"></i>
      </button>

      <!-- BOTÓN INSTALAR APP PWA -->
      <button id="btn-install-pwa" onclick="triggerPwaInstall()" class="px-2.5 py-1.5 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-md flex items-center gap-1 transition active:scale-95 cursor-pointer" title="Instalar Aplicación">
        <i data-lucide="download" class="w-3.5 h-3.5 stroke-[2.5]"></i>
        <span class="hidden sm:inline">Instalar</span>
      </button>

      <!-- Botón Cerrar Sesión -->
      <button onclick="handleLogout()" class="p-2 rounded-xl bg-slate-800 hover:bg-rose-900/40 text-slate-400 hover:text-rose-300 border border-slate-700/60 transition cursor-pointer" title="Cerrar Sesión">
        <i data-lucide="log-out" class="w-4 h-4"></i>
      </button>

    </div>
  </header>

  <!-- CONTENEDOR PRINCIPAL: SIDEBAR LATERAL + VISOR -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- TELÓN DE FONDO PARA MÓVILES (BACKDROP SIDEBAR) -->
    <div id="sidebar-backdrop" onclick="toggleSidebar(false)" class="fixed inset-0 z-30 bg-slate-950/70 backdrop-blur-sm hidden md:hidden"></div>

    <!-- SIDEBAR LATERAL DESPLEGABLE / COLAPSABLE (PC, TABLETS Y CELULARES) -->
    <aside id="app-sidebar" class="sidebar-collapsed fixed md:static inset-y-0 left-0 z-30 w-64 bg-slate-900/98 backdrop-blur-2xl border-r border-slate-800 p-3 flex flex-col justify-between overflow-y-auto shrink-0 shadow-2xl md:shadow-none">
      
      <!-- PARTE SUPERIOR DEL SIDEBAR -->
      <div class="space-y-3">
        
        <!-- Cabecera del Sidebar con selector de modo y botón de cerrar -->
        <div class="flex items-center justify-between px-1 pb-2 border-b border-slate-800/80">
          <div class="flex items-center gap-2">
            <i data-lucide="compass" class="w-4 h-4 text-cyan-400"></i>
            <span class="text-xs font-black uppercase text-slate-300 tracking-wider sidebar-header-text">Navegación</span>
          </div>
          <button onclick="toggleSidebar(false)" class="md:hidden p-1 text-slate-400 hover:text-white">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <!-- LISTA DE MENÚS DEL SISTEMA -->
        <nav class="space-y-1" id="sidebar-nav-links">
          
          <!-- 1. Panel de Control -->
          <button onclick="switchTab('dashboard')" id="side-dashboard" class="sidebar-tab active-tab w-full px-3 py-2.5 rounded-2xl text-xs font-extrabold flex items-center gap-3 transition cursor-pointer">
            <i data-lucide="layout-dashboard" class="w-4 h-4 shrink-0"></i>
            <span class="sidebar-label">Panel General</span>
          </button>

          <!-- 2. Personal (87) -->
          <button onclick="switchTab('employees')" id="side-employees" class="sidebar-tab w-full px-3 py-2.5 rounded-2xl text-xs font-extrabold text-slate-300 hover:text-white hover:bg-slate-800/60 transition flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="users" class="w-4 h-4 shrink-0"></i>
              <span class="sidebar-label">Personal</span>
            </div>
            <span class="sidebar-badge px-2 py-0.5 rounded-full text-[9px] font-black bg-blue-500/20 text-cyan-300">87</span>
          </button>

          <!-- 3. Diseñador de Fotochecks -->
          <button onclick="switchTab('badges')" id="side-badges" class="sidebar-tab w-full px-3 py-2.5 rounded-2xl text-xs font-extrabold text-slate-300 hover:text-white hover:bg-slate-800/60 transition flex items-center gap-3 cursor-pointer">
            <i data-lucide="id-card" class="w-4 h-4 shrink-0"></i>
            <span class="sidebar-label">Diseñador Fotochecks</span>
          </button>

          <!-- 4. Tareo, Modificación & Planillas -->
          <button onclick="switchTab('reports')" id="side-reports" class="sidebar-tab w-full px-3 py-2.5 rounded-2xl text-xs font-extrabold text-slate-300 hover:text-white hover:bg-slate-800/60 transition flex items-center justify-between cursor-pointer">
            <div class="flex items-center gap-3">
              <i data-lucide="file-spreadsheet" class="w-4 h-4 shrink-0"></i>
              <span class="sidebar-label">Tareo & Planillas</span>
            </div>
            <span class="sidebar-badge px-1.5 py-0.5 rounded text-[8px] font-black bg-emerald-500/20 text-emerald-300">EXCEL</span>
          </button>

          <!-- 5. Sedes & Geocercas GPS -->
          <button onclick="switchTab('branches')" id="side-branches" class="sidebar-tab w-full px-3 py-2.5 rounded-2xl text-xs font-extrabold text-slate-300 hover:text-white hover:bg-slate-800/60 transition flex items-center gap-3 cursor-pointer">
            <i data-lucide="map-pin" class="w-4 h-4 shrink-0 text-cyan-400"></i>
            <span class="sidebar-label">Sedes & Geocercas GPS</span>
          </button>

          <!-- 6. Gestión de Usuarios & Contraseñas -->
          <button onclick="switchTab('users')" id="side-users" class="sidebar-tab w-full px-3 py-2.5 rounded-2xl text-xs font-extrabold text-slate-300 hover:text-white hover:bg-slate-800/60 transition flex items-center gap-3 cursor-pointer">
            <i data-lucide="key" class="w-4 h-4 shrink-0 text-amber-400"></i>
            <span class="sidebar-label">Usuarios & Credenciales</span>
          </button>

          <!-- Separador -->
          <div class="pt-2 pb-0.5">
            <p class="text-[9px] font-black uppercase text-slate-500 px-3 sidebar-header-text">Marcaciones y Kiosco</p>
          </div>

          <!-- 7. Kiosco Escáner QR -->
          <button onclick="switchTab('kiosk')" id="side-kiosk" class="sidebar-tab w-full px-3 py-2.5 rounded-2xl text-xs font-extrabold text-slate-300 hover:text-white hover:bg-slate-800/60 transition flex items-center gap-3 cursor-pointer">
            <i data-lucide="scan" class="w-4 h-4 shrink-0 text-cyan-400"></i>
            <span class="sidebar-label">Kiosco Escáner QR</span>
          </button>

          <!-- 8. Portal del Trabajador (Independiente) -->
          <a href="/portal-trabajador.html" target="_blank" class="sidebar-tab w-full px-3 py-2.5 rounded-2xl text-xs font-extrabold text-amber-300 hover:text-amber-200 hover:bg-amber-500/10 transition flex items-center justify-between cursor-pointer border border-amber-500/20">
            <div class="flex items-center gap-3">
              <i data-lucide="external-link" class="w-4 h-4 shrink-0 text-amber-400"></i>
              <span class="sidebar-label">Portal Trabajador (URL)</span>
            </div>
            <span class="sidebar-badge text-[8px] bg-amber-400/20 text-amber-300 px-1.5 py-0.5 rounded font-black">NUEVO</span>
          </a>

        </nav>
      </div>

      <!-- PIE DEL SIDEBAR -->
      <div class="pt-3 border-t border-slate-800/80 space-y-1.5">
        <div class="p-2.5 rounded-2xl bg-slate-950/80 border border-slate-800 flex items-center gap-2.5 sidebar-header-text">
          <div class="w-7 h-7 rounded-xl bg-blue-600/20 text-cyan-400 flex items-center justify-center font-black text-xs border border-cyan-500/30 shrink-0">
            D
          </div>
          <div class="overflow-hidden">
            <p class="text-xs font-extrabold text-white truncate" id="nav-user-name">Administrador</p>
            <p class="text-[9px] text-cyan-400 font-mono truncate" id="nav-user-role">DALUPEZMAR ADMIN</p>
          </div>
        </div>
      </div>

    </aside>

    <!-- VISOR UNIFICADO PRINCIPAL (MIN-W-0 para evitar desborde flex) -->
    <main class="flex-1 min-w-0 w-full max-w-full relative bg-slate-950 overflow-hidden">
      <iframe id="main-app-frame" src="/dashboard.html" class="app-frame w-full max-w-full" title="Módulo DALUPEZMAR"></iframe>
    </main>

  </div>

  <!-- BARRA INFERIOR RÁPIDA PARA CELULARES (ACCESO DIRECTO) -->
  <nav class="md:hidden h-[58px] bg-slate-900/98 backdrop-blur-2xl border-t border-slate-800 grid grid-cols-5 items-center px-1 z-40 safe-bottom shadow-2xl">
    
    <button onclick="switchTab('dashboard')" id="mob-dashboard" class="mob-tab active-tab flex flex-col items-center justify-center py-1 transition cursor-pointer">
      <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Panel</span>
    </button>

    <button onclick="switchTab('employees')" id="mob-employees" class="mob-tab flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
      <i data-lucide="users" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Personal</span>
    </button>

    <button onclick="switchTab('reports')" id="mob-reports" class="mob-tab flex flex-col items-center justify-center py-1 text-slate-400 hover:text-white transition cursor-pointer">
      <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>
      <span class="text-[9px] font-bold mt-0.5">Tareo</span>
    </button>

    <button onclick="switchTab('kiosk')" id="mob-kiosk" class="mob-tab flex flex-col items-center justify-center py-1 text-slate-400 hover:text-cyan-300 transition cursor-pointer">
      <i data-lucide="scan" class="w-4 h-4 text-cyan-400"></i>
      <span class="text-[9px] font-bold mt-0.5">Kiosco</span>
    </button>

    <button onclick="window.open('/portal-trabajador.html', '_blank')" id="mob-worker" class="mob-tab flex flex-col items-center justify-center py-1 text-amber-400 hover:text-amber-300 transition cursor-pointer">
      <i data-lucide="camera" class="w-4 h-4 text-amber-400"></i>
      <span class="text-[9px] font-bold mt-0.5">Trabajador</span>
    </button>

  </nav>

  <!-- Scripts -->
  <script src="/js/api.js?v=5.1"></script>
  <script src="/js/auth.js?v=5.1"></script>
  <script>
    // Prevenir anidamiento accidental dentro de iframes
    if (window.self !== window.top) {
      window.top.location.href = '/app.html';
    }

    lucide.createIcons();

    const MODULE_ROUTES = {
      dashboard: '/dashboard.html',
      employees: '/employees.html',
      badges: '/badge-designer.html',
      reports: '/reports.html',
      branches: '/branches.html',
      users: '/users.html',
      kiosk: '/kiosk.html'
    };

    const MODULE_TITLES = {
      dashboard: 'Panel de Control',
      employees: 'Gestión de Personal (87)',
      badges: 'Diseñador de Fotochecks',
      reports: 'Tareo & Planillas (Excel)',
      branches: 'Sedes & Geocercas GPS',
      users: 'Usuarios & Credenciales',
      kiosk: 'Kiosco Escáner QR'
    };

    let isSidebarOpen = window.innerWidth >= 769;

    function toggleSidebar(forceState) {
      const sidebar = document.getElementById('app-sidebar');
      const backdrop = document.getElementById('sidebar-backdrop');
      
      if (typeof forceState === 'boolean') {
        isSidebarOpen = forceState;
      } else {
        isSidebarOpen = !isSidebarOpen;
      }

      if (window.innerWidth < 769) {
        // En celulares: slide over drawer
        if (isSidebarOpen) {
          sidebar.classList.remove('sidebar-collapsed');
          backdrop.classList.remove('hidden');
        } else {
          sidebar.classList.add('sidebar-collapsed');
          backdrop.classList.add('hidden');
        }
      } else {
        // En PC: expandir / colapsar
        backdrop.classList.add('hidden');
        if (isSidebarOpen) {
          sidebar.classList.remove('sidebar-collapsed');
        } else {
          sidebar.classList.add('sidebar-collapsed');
        }
      }
    }

    function switchTab(tabKey) {
      if (!MODULE_ROUTES[tabKey]) return;

      const frame = document.getElementById('main-app-frame');
      const titleEl = document.getElementById('current-view-title');

      if (titleEl) titleEl.textContent = MODULE_TITLES[tabKey] || 'DALUPEZMAR';

      if (frame) {
        frame.style.opacity = '0.3';
        frame.src = MODULE_ROUTES[tabKey];
        frame.onload = () => { 
          frame.style.opacity = '1';
          syncThemeWithFrame();
        };
      }

      // Actualizar sidebar tabs
      document.querySelectorAll('.sidebar-tab').forEach(btn => {
        btn.classList.remove('active-tab');
        btn.classList.add('text-slate-300');
      });
      const activeSide = document.getElementById(`side-${tabKey}`);
      if (activeSide) {
        activeSide.classList.add('active-tab');
        activeSide.classList.remove('text-slate-300');
      }

      // Actualizar mobile bottom tabs
      document.querySelectorAll('.mob-tab').forEach(btn => {
        btn.classList.remove('active-tab');
        btn.classList.add('text-slate-400');
      });
      const activeMob = document.getElementById(`mob-${tabKey}`);
      if (activeMob) {
        activeMob.classList.add('active-tab');
        activeMob.classList.remove('text-slate-400');
      }

      // En móviles, cerrar el sidebar automáticamente al seleccionar una opción
      if (window.innerWidth < 769) {
        toggleSidebar(false);
      }

      lucide.createIcons();
    }

    function handleRoleSwitch(role) {
      if (role === 'ADMIN') {
        switchTab('dashboard');
      } else if (role === 'SUPERVISOR') {
        switchTab('remote');
      } else if (role === 'WORKER') {
        window.open('/portal-trabajador.html', '_blank');
      }
    }

    function toggleUnifiedTheme() {
      toggleAppTheme();
      syncThemeWithFrame();
    }

    function syncThemeWithFrame() {
      const frame = document.getElementById('main-app-frame');
      if (frame && frame.contentDocument) {
        const theme = getSavedTheme();
        const isLight = theme === 'light';
        const doc = frame.contentDocument.documentElement;
        const body = frame.contentDocument.body;

        if (isLight) {
          doc.classList.add('light-mode');
          doc.classList.remove('dark', 'dark-mode');
          if (body) {
            body.classList.add('light-mode');
            body.classList.remove('dark', 'dark-mode');
          }
        } else {
          doc.classList.add('dark', 'dark-mode');
          doc.classList.remove('light-mode');
          if (body) {
            body.classList.add('dark', 'dark-mode');
            body.classList.remove('light-mode');
          }
        }
      }
    }

    function handleLogout() {
      if (confirm('¿Deseas cerrar sesión del sistema?')) {
        api.clearSession();
        window.location.href = '/index.html';
      }
    }

    // Inicializar estado del sidebar en celulares
    if (window.innerWidth < 769) {
      toggleSidebar(false);
    }

    // PWA Install prompt
    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      } else {
        alert('Para instalar DALUPEZMAR:\nEn tu navegador Chrome o Edge, toca los 3 puntos ⋮ y presiona "Instalar aplicación" o "Añadir a pantalla principal".');
      }
    }
  </script>
</body>
</html>
