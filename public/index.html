<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DALUPEZMAR | Sistema Integral de Asistencia y Fotochecks</title>
  
  <!-- PWA Metadata -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#002855">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DALUPEZMAR">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css?v=3.0">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">

  <!-- Botones de Cabecera en Login -->
  <div class="absolute top-4 right-4 z-50 flex items-center gap-2">
    <button id="btn-install-login" onclick="triggerPwaInstall()" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs shadow-lg shadow-amber-500/20 flex items-center gap-1.5 transition">
      <i data-lucide="download" class="w-4 h-4"></i>
      <span class="hidden sm:inline">Instalar App</span>
    </button>
    <button class="btn-theme-toggle p-2.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-amber-300 border border-slate-700/60 shadow-lg transition" title="Cambiar Modo Claro / Oscuro">
      <i data-lucide="sun" class="w-4 h-4"></i>
    </button>
  </div>

  <div class="max-w-md w-full glass-panel p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6 relative overflow-hidden my-auto">
    
    <!-- Efecto de Fondo Luminoso -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Cabecera y Logo Oficial DALUPEZMAR -->
    <div class="text-center space-y-2.5">
      <img src="/icons/icon-192.png" alt="DALUPEZMAR Logo" class="w-20 h-20 rounded-3xl mx-auto shadow-2xl shadow-blue-500/40 border-2 border-cyan-400/50 object-cover transform hover:scale-105 transition">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-white">
          DALUPEZMAR
        </h1>
        <p class="text-xs text-cyan-400 font-bold tracking-wide mt-0.5">SISTEMA INTEGRAL 2026</p>
      </div>
      <p class="text-[11px] text-slate-400 font-semibold">Plataforma Unificada de Asistencia, Fotochecks y Tareo</p>
    </div>

    <!-- Formulario de Inicio de Sesión -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Usuario</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
          <input type="text" id="login-username" value="admin" required placeholder="admin" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Contraseña</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
          <input type="password" id="login-password" value="admin123" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-sm shadow-xl shadow-blue-500/25 flex items-center justify-center gap-2 transition transform active:scale-95">
        <i data-lucide="log-in" class="w-4 h-4"></i> Ingresar al Entorno Único
      </button>
    </form>

    <!-- Acceso Directo al Entorno Completo -->
    <div class="pt-3 border-t border-slate-800/80">
      <a href="/app.html" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-cyan-300 text-xs font-black flex items-center justify-center gap-2 transition shadow-inner">
        <i data-lucide="monitor" class="w-4 h-4"></i> Abrir Entorno Directo (PC / Móvil)
      </a>
    </div>

    <!-- Credenciales Oficiales -->
    <div class="bg-slate-900/50 p-2.5 rounded-xl border border-slate-800 text-[11px] text-slate-400 text-center">
      Acceso Administrativo: Usuario: <b class="text-blue-400 font-mono">admin</b> | Clave: <b class="text-blue-400 font-mono">admin123</b>
    </div>

  </div>

  <!-- Scripts -->
  <script src="/js/api.js?v=3.0"></script>
  <script src="/js/auth.js?v=3.0"></script>
  <script>
    lucide.createIcons();

    // Si ya tiene sesión activa, redirigir al entorno único
    if (api.getToken()) {
      window.location.href = '/app.html';
    }

    document.getElementById('login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-2">⏳</span> Ingresando...`;

      try {
        const res = await api.auth.login({ username, password });
        if (res && res.success) {
          api.setToken(res.data.token);
          api.setUser(res.data.user);
          showToast('¡Bienvenido! Entrando al sistema unificado...', 'success');
          setTimeout(() => {
            window.location.href = '/app.html';
          }, 400);
        } else {
          showToast(res.message || 'Credenciales incorrectas.', 'error');
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Ingresar al Entorno Único`;
          lucide.createIcons();
        }
      } catch (error) {
        showToast(error.message || 'Error al conectar con el servidor.', 'error');
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Ingresar al Entorno Único`;
        lucide.createIcons();
      }
    });

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    function triggerPwaInstall() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt = null;
      } else {
        alert('Para instalar DALUPEZMAR:\nEn Chrome o Edge, haz clic en el ícono de instalar en la barra de direcciones.');
      }
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
</body>
</html>
