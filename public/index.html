<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso al Sistema | AGY Asistencia & Fotochecks</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative">

  <!-- Botón de Tema en Login -->
  <div class="absolute top-6 right-6 z-50">
    <button class="btn-theme-toggle p-2.5 px-3.5 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-amber-300 border border-slate-700/60 shadow-lg transition flex items-center gap-2" title="Cambiar Modo Claro / Oscuro">
      <i data-lucide="sun" class="w-4 h-4"></i>
      <span class="text-xs font-bold">Modo Claro</span>
    </button>
  </div>

  <div class="max-w-md w-full glass-panel p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-7 relative overflow-hidden">
    
    <!-- Efecto de Fondo Luminoso -->
    <div class="absolute -top-24 -left-24 w-48 h-48 bg-blue-600/30 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-24 -right-24 w-48 h-48 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Cabecera y Logo -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 via-cyan-500 to-indigo-500 mx-auto flex items-center justify-center shadow-xl shadow-blue-500/30">
        <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
      </div>
      <h1 class="text-2xl font-black tracking-tight bg-gradient-to-r from-blue-400 via-cyan-300 to-indigo-200 bg-clip-text text-transparent">
        AGY Asistencia & Fotochecks
      </h1>
      <p class="text-xs text-slate-400 font-medium">Plataforma Empresarial de Control de Asistencia y Credenciales</p>
    </div>

    <!-- Formulario de Inicio de Sesión -->
    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Usuario</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
          <input type="text" id="login-username" value="admin" required placeholder="admin" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Contraseña</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
          <input type="password" id="login-password" value="admin123" required placeholder="••••••••" class="w-full bg-slate-900/90 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
        </div>
      </div>

      <button type="submit" id="btn-login-submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold text-sm shadow-xl shadow-blue-500/25 flex items-center justify-center gap-2 transition transform active:scale-95">
        <i data-lucide="log-in" class="w-4 h-4"></i> Ingresar al Sistema
      </button>
    </form>

    <!-- Accesos Rápidos Públicos -->
    <div class="pt-4 border-t border-slate-800/80 space-y-2">
      <p class="text-[11px] text-center text-slate-400 font-semibold uppercase">Accesos Rápidos de Marcación:</p>
      <div class="grid grid-cols-2 gap-2">
        <a href="/kiosk.html" class="p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-cyan-400 hover:text-cyan-300 text-xs font-bold flex items-center justify-center gap-1.5 transition">
          <i data-lucide="scan" class="w-3.5 h-3.5"></i> Modo Kiosco QR
        </a>
        <a href="/remote-attendance.html" class="p-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 border border-slate-800 text-emerald-400 hover:text-emerald-300 text-xs font-bold flex items-center justify-center gap-1.5 transition">
          <i data-lucide="map-pin" class="w-3.5 h-3.5"></i> Marcación Remota
        </a>
      </div>
    </div>

    <!-- Credenciales de Demostración -->
    <div class="bg-slate-900/50 p-3 rounded-xl border border-slate-800 text-[11px] text-slate-400 text-center">
      Credenciales demo: Usuario: <b class="text-blue-400">admin</b> | Password: <b class="text-blue-400">admin123</b>
    </div>

  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    lucide.createIcons();

    document.getElementById('login-form')?.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('btn-login-submit');

      btn.disabled = true;
      btn.innerHTML = `<span class="animate-spin mr-2">⏳</span> Verificando...`;

      try {
        const res = await api.auth.login({ username, password });
        if (res && res.success) {
          api.setToken(res.data.token);
          api.setUser(res.data.user);
          showToast('¡Bienvenido! Redirigiendo...', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 600);
        } else {
          showToast(res.message || 'Credenciales incorrectas.', 'error');
          btn.disabled = false;
          btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Ingresar al Sistema`;
          lucide.createIcons();
        }
      } catch (error) {
        showToast(error.message || 'Error al conectar con el servidor.', 'error');
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="log-in" class="w-4 h-4"></i> Ingresar al Sistema`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
