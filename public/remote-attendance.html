<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marcación Remota con GPS | AGY Asistencia</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between p-4 sm:p-6">

  <!-- CABECERA MÓVIL -->
  <header class="max-w-md mx-auto w-full flex items-center justify-between py-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
        <i data-lucide="map-pin" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="text-base font-black text-white">Marcación Remota</h1>
        <p class="text-[11px] text-slate-400">Portal de Teletrabajo & Campo</p>
      </div>
    </div>

    <a href="/index.html" class="p-2 rounded-xl bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs flex items-center gap-1.5">
      <i data-lucide="log-in" class="w-4 h-4"></i> Login Admin
    </a>
  </header>

  <!-- CONTENIDO PRINCIPAL DE MARCACIÓN -->
  <main class="max-w-md mx-auto w-full space-y-5 my-auto py-4">
    
    <!-- TARJETA DE ESTADO GPS -->
    <div class="glass-panel p-4 rounded-2xl border border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="gps-status-indicator" class="w-3 h-3 rounded-full bg-amber-400 animate-pulse"></div>
        <div>
          <p id="gps-status-title" class="text-xs font-bold text-white">Detectando Ubicación GPS...</p>
          <p id="gps-status-coords" class="text-[10px] text-slate-400 font-mono">Obteniendo coordenadas satelitales</p>
        </div>
      </div>
      <button id="btn-refresh-gps" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- TARJETA DE IDENTIFICACIÓN DE EMPLEADO -->
    <div class="glass-panel p-6 rounded-3xl border border-slate-800 shadow-2xl space-y-4">
      <div class="text-center space-y-1">
        <div id="remote-clock" class="text-3xl font-black font-mono text-cyan-300">--:--:--</div>
        <p id="remote-date" class="text-xs text-slate-400 font-semibold uppercase">Cargando...</p>
      </div>

      <!-- Input de Identificación -->
      <div>
        <label class="block text-xs font-bold text-slate-300 mb-1.5 uppercase tracking-wider">Número de DNI / Documento</label>
        <div class="relative">
          <i data-lucide="user-check" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
          <input type="text" id="remote-doc-input" placeholder="Ingresa tu DNI (Ej: 45892147)" class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-sm text-white font-mono font-bold placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition">
        </div>
      </div>

      <!-- BOTONES DE MARCACIÓN REMOTA -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button type="button" onclick="submitRemotePunch('ENTRY')" class="py-3.5 px-4 rounded-2xl bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-500 hover:to-teal-400 text-white font-black text-xs shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 transition active:scale-95">
          <i data-lucide="log-in" class="w-4 h-4"></i> ENTRADA
        </button>
        <button type="button" onclick="submitRemotePunch('EXIT')" class="py-3.5 px-4 rounded-2xl bg-gradient-to-r from-rose-600 to-red-500 hover:from-rose-500 hover:to-red-400 text-white font-black text-xs shadow-lg shadow-rose-500/20 flex items-center justify-center gap-2 transition active:scale-95">
          <i data-lucide="log-out" class="w-4 h-4"></i> SALIDA
        </button>
        <button type="button" onclick="submitRemotePunch('LUNCH_START')" class="py-3 px-4 rounded-2xl bg-slate-900 border border-slate-700 hover:border-amber-500 text-amber-300 font-bold text-xs flex items-center justify-center gap-2 transition active:scale-95">
          <i data-lucide="utensils" class="w-4 h-4 text-amber-400"></i> Inicio Refrigerio
        </button>
        <button type="button" onclick="submitRemotePunch('LUNCH_END')" class="py-3 px-4 rounded-2xl bg-slate-900 border border-slate-700 hover:border-cyan-500 text-cyan-300 font-bold text-xs flex items-center justify-center gap-2 transition active:scale-95">
          <i data-lucide="coffee" class="w-4 h-4 text-cyan-400"></i> Fin Refrigerio
        </button>
      </div>

    </div>

    <!-- TARJETA DE CONFIRMACIÓN DE MARCACIÓN REMOTA -->
    <div id="remote-result-box" class="glass-panel p-5 rounded-2xl border border-emerald-500/30 bg-emerald-950/20 hidden space-y-3">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
          <i data-lucide="check-circle-2" class="w-5 h-5"></i>
        </div>
        <div>
          <h4 id="remote-res-title" class="text-sm font-bold text-white">¡Marcación Exitosa!</h4>
          <p id="remote-res-name" class="text-xs text-emerald-300 font-semibold">Carlos Alberto Mendoza</p>
        </div>
      </div>
      <p id="remote-res-msg" class="text-xs text-slate-300 bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 font-mono"></p>
    </div>

  </main>

  <!-- PIE DE PÁGINA -->
  <footer class="max-w-md mx-auto w-full text-center text-[11px] text-slate-500 py-2">
    CORPORACIÓN GLOBAL TECH S.A.C. • Sistema de Control Remoto de Personal
  </footer>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/remote.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
